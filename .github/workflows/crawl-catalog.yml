name: Crawl brand catalogs

# Monthly full re-crawl of every Independent brand's website for its logo and watch
# catalog (see scripts/crawl-catalog.ts). Results are committed to data/catalog/,
# which the API's sync job imports into the database.
on:
  schedule:
    - cron: "0 6 1 * *" # 1st of each month, 06:00 UTC (sold-out checks run weekly in check-availability.yml)
  workflow_dispatch:
    inputs:
      ids:
        description: "Only these brand IDs (comma-separated, e.g. BRD-0001,BRD-0002)"
        required: false
      max_age_days:
        description: "Skip brands crawled within this many days (0 = crawl all)"
        required: false
        default: "20"
      images_only:
        description: "Only (re)store images for existing catalogs, no crawl"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: crawl-catalog
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      IMAGE_STORE: ${{ vars.IMAGE_STORE }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      INGEST_CONTACT_EMAIL: ${{ vars.INGEST_CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Crawl
        env:
          IDS: ${{ inputs.ids }}
          MAX_AGE: ${{ inputs.max_age_days || '20' }}
          IMAGES_ONLY: ${{ inputs.images_only }}
        run: |
          [[ "$MAX_AGE" =~ ^[0-9]+$ ]] || MAX_AGE=20
          ARGS="--concurrency 12 --max-age-days $MAX_AGE"
          if [[ "$IDS" =~ ^[A-Za-z0-9,-]+$ ]]; then ARGS="$ARGS --ids $IDS"; fi
          if [ "$IMAGES_ONLY" = "true" ]; then ARGS="$ARGS --images-only"; fi
          # Stop crawling before the job limit so partial results still get committed;
          # the next run picks up where this one stopped (--max-age-days).
          timeout 320m npm run crawl -- $ARGS || echo "crawl stopped early (exit $?)"
      - name: Commit catalog changes
        run: |
          git config user.name "lugworthy-crawler"
          git config user.email "crawler@users.noreply.github.com"
          git add data/catalog
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update brand catalogs ($(date -u +%Y-%m-%d))"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
