name: Check sold-out watches

# Weekly: re-checks every sold-out watch on the brand's own site and records
# whether it is back in stock (scripts/check-availability.ts). Shopify and
# WooCommerce brands get every watch re-checked, since that's one request per brand.
on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  workflow_dispatch:
    inputs:
      all:
        description: "Re-check every watch, not just sold-out ones"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: crawl-catalog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      INGEST_CONTACT_EMAIL: ${{ vars.INGEST_CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Check availability
        run: timeout 170m npm run check:availability -- ${{ inputs.all && '--all' || '' }} || echo "stopped early (exit $?)"
      - name: Commit changes
        run: |
          git config user.name "lugworthy-crawler"
          git config user.email "crawler@users.noreply.github.com"
          git add data/catalog
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update watch availability ($(date -u +%Y-%m-%d))"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
